<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>SIGI — Iniciar sesión</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="main-wrapper">
        <div class="login-container">
            <!-- Lado Izquierdo: Carrusel -->
            <div class="split-left">
                <div class="carousel-overlay"></div>
                <div class="carousel-fade">
                    <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjdfTDwQVh8mAW2iWgRR-WJ64FIKVxRx8OVOhHjqDmQKRmdgnamFZLewiUFi4cvfn_XBM9o7u6u3H5rBXd49xsgmfEnpT_sXOuM6UZpSEB3O0wOFtfbrErHGKElPNso9AnHX79fOwJByNTz/w1200-h630-p-k-no-nu/Florencia+Caquet%25C3%25A1.jpg" alt="Palacio de Bellas Artes" class="img-slide active">
                    <img src="https://images.trvl-media.com/place/6262382/5fab3fa4-0db4-496f-a1d6-60b352525075.jpg" alt="Gobernación del Caquetá" class="img-slide">
                    <img src="https://imagescdn.citix.com.co/citix/production/media/media/eff4f1ca69ec225874f6944b78ebe525.jpg" alt="Plaza Pizarro" class="img-slide">
                    <img src="https://soyviajerocolombia.com/wp-content/uploads/2022/12/PHOTO-2022-12-23-18-25-18-4.jpg" alt="Río Caquetá" class="img-slide">
                </div>
            </div>
            
            <!-- Lado Derecho: Formulario -->
            <div class="split-right">
                
                <a href="/dashboard/index.html" class="btn-volver">
                    <i class="bi bi-arrow-left" aria-hidden="true"></i>
                    <span>Volver</span>
                </a>
                
                <main class="form-container">
                    <div class="form-content">
                        <div class="login-marca-form">
                            <img src="../assets/img/image.png" alt="Logo SIGI" class="login-logo">
                            <span>SIGI</span>
                        </div>
                        <h1>Análisis de incidentes</h1>
                        <p class="subtitle">Acceso para administradores.</p>
                        
                        <form id="loginForm" class="login-form">
                            <section class="input-group">
                                <label for="nameuser">Correo institucional</label>
                                <div class="input-wrapper">
                                    <i class="bi bi-person" aria-hidden="true"></i>
                                    <input type="text" placeholder="admin@sigi.gov.co" id="nameuser" autocomplete="username">
                                </div>
                            </section>
                            
                            <section class="input-group">
                                <label for="pssuser">Contraseña</label>
                                <div class="input-wrapper">
                                    <i class="bi bi-lock" aria-hidden="true"></i>
                                    <input type="password" placeholder="•••••••••••" id="pssuser" autocomplete="current-password">
                                    <i class="bi bi-eye toggle-password" id="togglePassword" aria-label="Mostrar contraseña" role="button" tabindex="0"></i>
                                </div>
                            </section>
                            
                            <p id="resp" role="alert"></p>
                            
                            <button type="submit" class="btn-primary">
                                Iniciar sesión
                            </button>
                            
                            <div class="secure-badge">
                                <i class="bi bi-lock-fill" aria-hidden="true"></i>
                                <span>Entorno seguro y encriptado</span>
                            </div>
                        </form>
                    </div>
                </main>
            </div>
        </div>

        <!-- Footer original -->
        <footer class="sigi-footer">
            <div class="footer-contenido">
                <p class="footer-marca">SIGI — Sistema de Información Geográfica de Incidentes</p>
                <p class="footer-autor">Daniel Felipe Vera Perdomo · Proyecto académico del SENA</p>
                <p class="footer-copy">© 2025 SENA. Todos los derechos reservados.</p>
            </div>
        </footer>
    </div>
    <script src="login.js"></script>
</body>
</html>
